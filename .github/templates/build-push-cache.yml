# Coordinated fleet build + cache push.
#
# Model: ONE coordinator runs nix-fast-build, which evaluates locally and
# distributes builds to nix remote builders (nix's own builders = ssh-ng://
# fan-out, multiple hosts, results return to the coordinator's store). The
# coordinator then pushes what it holds to niks3 once — server-side
# deduplication makes overlap with anything builders pushed themselves
# harmless. nix-fast-build's --niks3-server does the same thing via
# `niks3 push` after the build; auth is GitHub OIDC — the refresher loop
# below mints tokens bound to the cache audience into the file niks3
# re-reads periodically (nix-fast-build itself never sees OIDC).
#
# GHA-local builds (capacity permitting) stay on niks3-action, which
# registers a post-build-hook and streams uploads with GitHub OIDC; both
# paths converge on the same deduplicating server.
#
# BUILDER CONFIGURATION COMES FROM THE FLEET REGISTRY — the workflow holds
# no builder coordinates. The consumer flake (imports
# inputs.nix-fleet.flakeModules.registry) renders its selected builder set
# with `packages.ci-builders-<set>` / `packages.ci-builders` (machines file,
# known_hosts, ssh_config); this workflow installs those artifacts. The only
# selection the workflow makes is the builder-set name.
#
# Template placeholders (CONSUMER FILLS):
#   {{BUILDER_SET}}     fleet.builderSets entry rendered for CI; canonical
#                       "ci" ships with nix-fleet (bundle: packages.ci);
#                       consumer-local sets render as packages.<set>
#   {{CACHE_URL}}       niks3 server base URL (substituter + keys + audience
#                       all come from its /api/cache-config, same as the action)
#   {{TARGETS}}         default flake attrspecs
#   {{SSH_KEY_SECRET}}  repo secret holding the coordinator's builder key
#   Tailscale join (fleet-host builders): set repo variable
#                       FLEET_CI_ON_TAILNET=true and the standard
#                       TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET secrets;
#                       the step skips itself when the variable is unset.
#
# Builder prerequisites: nixpkgs revisions aligned (consumers follow
# nix-fleet's nixpkgs input), coordinator key authorized by the builders,
# substituter pointing at the cache so --skip-cached is meaningful.
# Degradation is native: an unreachable builder simply drops out of nix's
# scheduling and work lands on the remaining builders and the runner's own
# store — the registry carries no failover logic.
name: build-push-cache
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Flake attrspecs to build (space-separated)"
        required: false
        default: "{{TARGETS}}"
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: "{{TARGETS}}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-push-cache
  cancel-in-progress: false

jobs:
  fleet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Join tailnet (fleet-host builders)
        # MagicDNS names in the registry's machines file resolve only inside
        # the tailnet. External-only builder sets skip this step; the
        # registry's ssh_config/known_hosts carry everything else.
        # Skips itself when TS_OAUTH_CLIENT_ID is unset in the repo.
        if: ${{ vars.FLEET_CI_ON_TAILNET == 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Install fleet builder artifacts from the registry
        # Builds the consumer's rendered builder set (nix eval only) and
        # installs machines/known_hosts/ssh_config. The workflow never
        # stores builder coordinates; the registry is the SSOT.
        run: |
          BUNDLE=$(nix build --no-link --print-out-paths \
            ".#packages.x86_64-linux.ci{{BUILDER_SET_SUFFIX}}")
          mkdir -p ~/.ssh
          sudo cp "$BUNDLE/known_hosts" /etc/ssh/ssh_known_hosts
          cat "$BUNDLE/ssh_config" >> ~/.ssh/config
          cp "$BUNDLE/machines" /tmp/nix-builders

      - name: Set up coordinator SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.{{SSH_KEY_SECRET}} }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Fetch cache config
        # Same endpoint the action uses: substituter, public keys, audience.
        id: cache
        run: |
          curl -sS "{{CACHE_URL}}/api/cache-config?issuer=https://token.actions.githubusercontent.com" \
            | jq -r '"substituter=" + .substituter_url, "public_keys=" + (.public_keys | join(" ")), "audience=" + .oidc_audience' \
            >> "$GITHUB_OUTPUT"

      - name: Start OIDC token refresher for niks3 push
        # niks3-action's auth-token-script output is daemon-mode-only, so we
        # mint directly: GitHub exposes ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN to
        # jobs with id-token: write; a background loop refreshes
        # $XDG_CONFIG_HOME/niks3/auth-token (niks3 re-reads the file
        # periodically) so the coordinator's `niks3 push` via
        # nix-fast-build --niks3-server always carries a current token bound
        # to the cache audience.
        run: |
          mkdir -p ~/.config/niks3
          cat > /tmp/refresh-oidc.sh <<'REFRESH'
          #!/usr/bin/env bash
          set -euo pipefail
          while true; do
            token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ steps.cache.outputs.audience }}" | jq -r .value)
            printf '%s' "$token" > "$HOME/.config/niks3/auth-token"
            sleep 180
          done
          REFRESH
          chmod +x /tmp/refresh-oidc.sh
          /tmp/refresh-oidc.sh &
          echo "REFRESHER_PID=$!" >> "$GITHUB_ENV"

      - name: Evaluate and distribute builds to fleet builders
        # Fan-out via nix's builders mechanism: nix schedules derivations
        # across the registry's builders AND the runner's own local store
        # (default max-jobs — the runner is just another builder; GHA local
        # capacity participates, and its aarch64 runners cover arm builds
        # fleet hosts cannot). Builders with the niks3 post-build-hook push
        # their work as it lands; results returning to the runner are pushed
        # by --niks3-server. niks3's server-side dedup/queueing makes the
        # overlap a no-op.
        env:
          NIX_CONFIG: |
            builders = @/tmp/nix-builders
            substituters = ${{ steps.cache.outputs.substituter }}
            trusted-public-keys = ${{ steps.cache.outputs.public_keys }}
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom --skip-cached \
            --flake .# ${{ inputs.targets }}

  gha-build:
    strategy:
      matrix:
        system: [x86_64-linux]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@v1
        with:
          server-url: { { CACHE_URL } }

      - name: Build (locally, streaming uploads)
        run: nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake .# ${{ inputs.targets }}
