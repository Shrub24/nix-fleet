# Coordinated fleet build + cache push.
#
# Model: ONE coordinator runs nix-fast-build, which evaluates locally and
# distributes builds to nix remote builders (nix's own builders = ssh-ng://
# fan-out, multiple hosts, results return to the coordinator's store). The
# coordinator then pushes what it holds to niks3 once — server-side
# deduplication makes overlap with anything builders pushed themselves
# harmless. nix-fast-build's --niks3-server does the same thing via
# `niks3 push` after the build; auth is GitHub OIDC — the refresher loop
# below mints tokens bound to the cache audience into the file niks3
# re-reads periodically (nix-fast-build itself never sees OIDC).
#
# GHA-local builds (capacity permitting) stay on niks3-action, which
# registers a post-build-hook and streams uploads with GitHub OIDC; both
# paths converge on the same deduplicating server.
#
# BUILDER CONFIGURATION COMES FROM THE FLEET INVENTORY — the workflow holds
# no builder coordinates. nix-fleet (inputs.nix-fleet.flakeModules.fleet)
# is the canonical authority; the consumer flake renders its selected
# builder set as `packages.ci` (canonical set) or `packages.<set>`
# (consumer-local sets) — machines file, known_hosts, ssh_config — and this
# workflow installs those artifacts. The only selection the workflow makes
# is the builder-set name.
#
# REUSABLE WORKFLOW: call it from a ~10-line consumer stub —
#
#   jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  fleet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@main
