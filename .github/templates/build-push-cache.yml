# Coordinated fleet build + cache push.
#
# Model: ONE coordinator runs nix-fast-build, which evaluates locally and
# distributes builds to nix remote builders (nix's own builders = ssh://...
# fan-out, multiple hosts, results return to the coordinator's store). The
# coordinator then pushes what it holds to niks3 once — server-side
# deduplication makes overlap with anything builders pushed themselves
# harmless. nix-fast-build's --niks3-server does the same thing via
# `niks3 push` after the build; auth comes from NIKS3_AUTH_TOKEN_FILE, so the
# coordinator needs a push token (fleet builder / CI token minted by the
# consumer), NOT the GitHub OIDC path — nix-fast-build does not read
# ACTIONS_ID_TOKEN.
#
# GHA-local builds (capacity permitting) stay on niks3-action, which
# registers a post-build-hook and streams uploads with GitHub OIDC; both
# paths converge on the same deduplicating server.
#
# Template placeholders (CONSUMER FILLS):
#   {{BUILDERS}}        nix builders line, e.g.
#                       "ssh://builder1 aarch64-linux ssh://builder2"
#   {{CACHE_URL}}       niks3 server base URL (substituter + keys + audience
#                       all come from its /api/cache-config, same as the action)
#   {{TARGETS}}         default flake attrspecs
#   {{SSH_KEY_SECRET}}  repo secret holding the coordinator's builder key
#
# Builder prerequisites: nixpkgs revisions aligned (consumers follow
# nix-fleet's nixpkgs input), coordinator key trusted by builders,
# substituter pointing at the cache so --skip-cached is meaningful.
name: build-push-cache
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Flake attrspecs to build (space-separated)"
        required: false
        default: "{{TARGETS}}"
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: "{{TARGETS}}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-push-cache
  cancel-in-progress: false

jobs:
  fleet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Set up coordinator SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.{{SSH_KEY_SECRET}} }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Fetch cache config
        # Same endpoint the action uses: substituter, public keys, audience.
        id: cache
        run: |
          curl -sS "{{CACHE_URL}}/api/cache-config?issuer=https://token.actions.githubusercontent.com" \
            | jq -r '"substituter=" + .substituter_url, "public_keys=" + (.public_keys | join(" ")), "audience=" + .oidc_audience' \
            >> "$GITHUB_OUTPUT"

      - name: Start OIDC token refresher for niks3 push
        # niks3-action's auth-token-script output is daemon-mode-only, so we
        # mint directly: GitHub exposes ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN to
        # jobs with id-token: write; a background loop refreshes
        # $XDG_CONFIG_HOME/niks3/auth-token (niks3 re-reads the file
        # periodically) so the coordinator's `niks3 push` via
        # nix-fast-build --niks3-server always carries a current token bound
        # to the cache audience.
        run: |
          mkdir -p ~/.config/niks3
          cat > /tmp/refresh-oidc.sh <<'REFRESH'
          #!/usr/bin/env bash
          set -euo pipefail
          while true; do
            token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ steps.cache.outputs.audience }}" | jq -r .value)
            printf '%s' "$token" > "$HOME/.config/niks3/auth-token"
            sleep 180
          done
          REFRESH
          chmod +x /tmp/refresh-oidc.sh
          /tmp/refresh-oidc.sh &
          echo "REFRESHER_PID=$!" >> "$GITHUB_ENV"

      - name: Evaluate and distribute builds to fleet builders
        # nix builders = the fan-out mechanism: nix schedules derivations
        # across ssh builders itself; results return to the runner's store.
        # --niks3-server makes nix-fast-build push realised paths with
        # `niks3 push` afterwards (dedup makes overlap harmless). No
        # post-build-hook involved: distributed work never fires the
        # coordinator's hook, the coordinator pushes explicitly.
        env:
          NIX_CONFIG: |
            builders = @/tmp/nix-builders
            substituters = ${{ steps.cache.outputs.substituter }}
            trusted-public-keys = ${{ steps.cache.outputs.public_keys }}
        run: |
          printf '%s\n' "${{ vars.NIX_BUILDERS }}" > /tmp/nix-builders
          nix run nixpkgs#nix-fast-build -- \
            --no-nom --skip-cached \
            --flake .# ${{ inputs.targets }}

  gha-build:
    strategy:
      matrix:
        system: [x86_64-linux]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@v1
        with:
          server-url: { { CACHE_URL } }

      - name: Build (locally, streaming uploads)
        run: nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake .# ${{ inputs.targets }}
