# Coordinated fleet build + cache push.
#
# Two paths, one cache:
#
# - Fleet builders (any host with the niks3-publisher aspect) already run the
#   niks3 post-build-hook (niks3-auto-upload): every path they realise is
#   pushed to the cache as it builds. The workflow only DISPATCHES to them
#   over SSH — no path collection, no push step for their output.
# - GitHub-hosted runners build directly (capacity permitting) through
#   niks3-action: it registers a native post-build-hook on the runner, so
#   uploads stream as derivations finish, and authenticates via GitHub OIDC
#   (permissions.id-token). No long-lived tokens; the consumer binds the
#   GitHub provider on services.niks3-cache.oidc.providers (write scope).
#
# Template placeholders (CONSUMER FILLS):
#   {{BUILDER_HOSTS}}   JSON array of SSH-reachable builders (may be [])
#   {{CACHE_URL}}       niks3 server base URL
#   {{TARGETS}}         default flake attrspecs to build
#
# Builder prerequisites: nix-fast-build available, nixpkgs revisions aligned
# with the repo under build (consumers follow nix-fleet's nixpkgs input).
name: build-push-cache
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Flake attrspecs to build (space-separated)"
        required: false
        default: "{{TARGETS}}"
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: "{{TARGETS}}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-push-cache
  cancel-in-progress: false

jobs:
  fleet-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        builder: { { BUILDER_HOSTS } }
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Dispatch nix-fast-build on the fleet builder
        # Builders push their own output through niks3-auto-upload; the
        # workflow does not collect or push for them.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets[format('SSH_KEY_{0}', matrix.builder)] }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "${{ matrix.builder }}" >> ~/.ssh/known_hosts
          rsync -az --delete --exclude .jj --exclude .git ./ "${{ matrix.builder }}:/tmp/nix-build-src/"
          ssh "${{ matrix.builder }}" \
            "nix-fast-build --no-nom --skip-cached --flake /tmp/nix-build-src# ${{ inputs.targets }}"

  gha-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@v1
        with:
          server-url: { { CACHE_URL } }

      - name: Build
        # Realised paths stream to the cache as each derivation finishes.
        run: nix-fast-build --no-nom --skip-cached --flake .# ${{ inputs.targets }}
