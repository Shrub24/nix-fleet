# Coordinated fleet build: one coordinator runs nix-fast-build and distributes to the
# remote builders rendered from the fleet inventory. Interface and prerequisites:
# docs/contracts/ci.md.
#
#   uses: Shrub24/nix-fleet/.github/workflows/build-push-cache.yml@<sha>
#   with: { targets: .#checks, profile: ci }
#   secrets: { BUILDER_SSH_KEY: "${{ secrets.FLEET_BUILDER_SSH_KEY }}" }
#
# The coordinator's builder and cache configuration is resolved from this workflow
# file's own revision (`job.workflow_sha`), so a caller pins one reference and gets
# matching machinery; its own flake stays independent. The calling job must grant
# `contents: read` and `id-token: write`; a narrower grant fails the call at
# startup. Outputs: `build` (success only when the build completed), `systems`,
# `runner`, `runner_system` (a label and a Nix system).
name: build-push-cache
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch:
    inputs:
      runner_system:
        description: "Coordinator architecture"
        type: choice
        options: [aarch64-linux, x86_64-linux]
        required: false
        default: "aarch64-linux"
      systems:
        description: "Target systems (space-separated); independent of coordinator architecture"
        required: false
        default: "x86_64-linux aarch64-linux"
      profile:
        description: "Fleet builder profile the coordinator renders"
        required: false
        default: "ci"
      targets:
        description: "Flake selection to build (defaults to .#checks)"
        required: false
        default: ".#checks"
      cache_api_url:
        description: "niks3 server base URL; empty resolves it from the fleet contract"
        required: false
        default: ""
      tailnet:
        description: "Join the tailnet before building"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves the fleet CI identity"
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty resolves the fleet CI identity"
        required: false
        default: ""
      revision:
        description: "Commit to build; empty builds the triggering ref"
        required: false
        default: ""
  workflow_call:
    inputs:
      runner_system:
        description: "Coordinator architecture: aarch64-linux or x86_64-linux"
        type: string
        required: false
        default: "aarch64-linux"
      systems:
        description: "Target systems (space-separated); independent of coordinator architecture"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      targets:
        description: "Flake selection to build (defaults to .#checks)"
        type: string
        required: false
        default: ".#checks"
      cache_api_url:
        description: 'niks3 server base URL; empty resolves packages.<system>.cache-api-url (fleet.services."niks3-write")'
        type: string
        required: false
        default: ""
      profile:
        description: "Fleet builder profile the coordinator renders"
        type: string
        required: false
        default: "ci"
      tailnet:
        description: "Join the tailnet before building; disable for public-only deployments"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves packages.x86_64-linux.ci-tailscale"
        type: string
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty uses the selected client's audience"
        type: string
        required: false
        default: ""
      revision:
        description: "Commit to build; empty builds the caller's commit"
        type: string
        required: false
        default: ""
    outputs:
      # Set only on success: an absent output means the stage did not complete.
      build:
        description: "success when the build completed"
        value: ${{ jobs.build.outputs.outcome }}
      systems:
        description: "Target systems that were built"
        value: ${{ jobs.prepare.outputs.systems }}
      runner:
        description: "GitHub runner label the build ran on (for a job's runs-on)"
        value: ${{ jobs.prepare.outputs.runner }}
      runner_system:
        description: "Nix system of the coordinator (aarch64-linux or x86_64-linux), for building .#packages.<system>.*"
        value: ${{ jobs.prepare.outputs.runner_system }}
    secrets:
      FLEET_BUILDER_SSH_KEY:
        description: "Repository coordinator key used by direct dispatch; reusable callers normally pass BUILDER_SSH_KEY"
        required: false
      BUILDER_SSH_KEY:
        description: "Coordinator's builder SSH key (authorized by builders' nixbuild account)"
        required: false

jobs:
  prepare:
    # Selection only: no checkout and no Nix, so a caller's flake is untouched here.
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.systems.outputs.systems }}
      runner: ${{ steps.systems.outputs.runner }}
      runner_system: ${{ inputs.runner_system }}
    steps:
      - name: Select coordinator and target systems
        id: systems
        env:
          RUNNER_SYSTEM: ${{ inputs.runner_system }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          case "$RUNNER_SYSTEM" in
            aarch64-linux) runner=ubuntu-24.04-arm ;;
            x86_64-linux) runner=ubuntu-latest ;;
            *) echo "::error::ci: unsupported runner_system '$RUNNER_SYSTEM'"; exit 1 ;;
          esac
          systems=$(printf '%s' "$SYSTEMS" | jq -Rsc 'split(" ") | map(select(length > 0)) | unique')
          if ! echo "$systems" | jq -e 'length > 0 and all(.[]; . == "x86_64-linux" or . == "aarch64-linux")' > /dev/null; then
            echo "::error::ci: systems must contain x86_64-linux or aarch64-linux"
            exit 1
          fi
          echo "systems=$(echo "$systems" | jq -r 'join(" ")')" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner }}
    # One build at a time per calling repository (concurrency is repository-scoped);
    # `queue: max` keeps pending runs. This group is declared
    # here and nowhere else: a job cannot acquire a group its own run holds.
    concurrency:
      group: fleet-build-stage
      cancel-in-progress: false
      queue: max
    outputs:
      outcome: ${{ steps.build.outputs.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@b3dedba4be0390a6e4c9d1c8e1a0494bf955947c # v1
        with:
          # The bootstrap cache: it must exist before the coordinator can be
          # resolved, so these two values are the only fleet facts stated here.
          # docs/contracts/ci.md names the check that keeps them honest.
          extra-conf: |
            extra-substituters = https://cache.shrublab.xyz
            extra-trusted-public-keys = nix-cache-1:FW0bJll9BP5ch0mHI+bXOImcD0RKLrH117WfQC+CU4A=

      - name: Install the fleet coordinator from this workflow's revision
        id: coordinator
        env:
          FLEET_REPO: ${{ job.workflow_repository }}
          FLEET_SHA: ${{ job.workflow_sha }}
          RUNNER_SYSTEM: ${{ inputs.runner_system }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          [ -n "$PROFILE" ] || { echo "::error::ci: a profile is required"; exit 1; }
          # job.workflow_sha is the commit that defines this reusable workflow, so the
          # machinery and its builder/cache facts cannot disagree. Substitution is the
          # normal path; a miss is an ordinary local build, not a failure.
          # `github:owner/repo/<ref>`: the `@` form is git-URL syntax and resolves
          # to a 404 here.
          coord=$(nix build --no-link --print-out-paths \
            "github:${FLEET_REPO}/${FLEET_SHA}#packages.${RUNNER_SYSTEM}.ci-coordinator-${PROFILE}")
          echo "coordinator=$coord" >> "$GITHUB_OUTPUT"
          sudo "$coord/install.sh"
          # Read the applied value back from the caller's own context: client settings
          # are per-invocation, and sudo has no `nix` on its PATH.
          nix config show builders

      - name: Resolve the tailnet identity
        id: tailscale
        if: ${{ inputs.tailnet }}
        env:
          COORDINATOR: ${{ steps.coordinator.outputs.coordinator }}
          OVERRIDE_ID: ${{ inputs.ts_client_id }}
          OVERRIDE_AUDIENCE: ${{ inputs.ts_audience }}
        run: |
          set -euo pipefail
          client_id=$OVERRIDE_ID
          audience=$OVERRIDE_AUDIENCE
          if [ -z "$client_id" ]; then
            client_id=$(jq -er '.clientId' "$COORDINATOR/tailscale.json")
            if [ -z "$audience" ]; then
              audience=$(jq -er '.audience' "$COORDINATOR/tailscale.json")
            fi
          elif [ -z "$audience" ]; then
            audience="api.tailscale.com/$client_id"
          fi
          [[ "$client_id" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::ci: invalid Tailscale client ID"; exit 1; }
          [[ -n "$audience" && "$audience" != *[[:space:]]* ]] || { echo "::error::ci: invalid Tailscale audience"; exit 1; }
          echo "client-id=$client_id" >> "$GITHUB_OUTPUT"
          echo "audience=$audience" >> "$GITHUB_OUTPUT"

      - name: Join tailnet (fleet-host builders)
        if: ${{ inputs.tailnet }}
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ steps.tailscale.outputs.client-id }}
          audience: ${{ steps.tailscale.outputs.audience }}
          tags: tag:ci

      - name: Install the builder SSH identity
        env:
          BUILDER_KEY: ${{ secrets.BUILDER_SSH_KEY || secrets.FLEET_BUILDER_SSH_KEY }}
          BUILDER_KEY_PATH: /etc/nix/builder_ed25519
        run: |
          set -euo pipefail
          [ -n "$BUILDER_KEY" ] || { echo "::error::ci: no builder key; pass secrets.BUILDER_SSH_KEY"; exit 1; }
          # Owned by the runner at 0600: OpenSSH rejects a group-readable key owned by
          # the user loading it, and root reads any file regardless of owner.
          (umask 0077; printf '%s\n' "$BUILDER_KEY" | sudo tee "$BUILDER_KEY_PATH" > /dev/null)
          sudo chown "$(id -un):$(id -gn)" "$BUILDER_KEY_PATH"
          sudo chmod 0600 "$BUILDER_KEY_PATH"

      - name: Resolve cache API URL
        id: cache-url
        env:
          COORDINATOR: ${{ steps.coordinator.outputs.coordinator }}
        run: |
          set -euo pipefail
          url='${{ inputs.cache_api_url }}'
          if [ -z "$url" ]; then
            url=$(cat "$COORDINATOR/cache-api-url")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@6d24bc1d87acdfac8e5dc3266f7b28ae99051adf # v1
        with:
          server-url: ${{ steps.cache-url.outputs.url }}

      - name: Build with the selected builder profile
        id: build
        env:
          SYSTEMS: ${{ needs.prepare.outputs.systems }}
          TARGETS: ${{ inputs.targets }}
          FLEET_REPO: ${{ job.workflow_repository }}
          FLEET_SHA: ${{ job.workflow_sha }}
          RUNNER_SYSTEM: ${{ inputs.runner_system }}
        run: |
          # Builders come from the coordinator (/etc/nix/machines); only runner policy
          # stays here.
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/build-start
          export NIX_CONFIG="${NIX_CONFIG:-}
          max-jobs = 1"
          # Stream diagnostics: a runner shutdown may prevent artifact upload.
          python3 -u - <<'PY' &
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          while True:
              memory = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
              vm = dict(line.split() for line in Path("/proc/vmstat").read_text().splitlines())
              disk = shutil.disk_usage("/nix/store")
              print(
                  f"ci resources {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}: "
                  f"MemAvailable={memory['MemAvailable'].strip()} "
                  f"MemTotal={memory['MemTotal'].strip()} "
                  f"SwapFree={memory['SwapFree'].strip()} "
                  f"SwapTotal={memory['SwapTotal'].strip()} "
                  f"oom_kill={vm['oom_kill']} "
                  f"store_free_MiB={disk.free // 2**20} load={os.getloadavg()}"
              )
              subprocess.run([
                  "ps", "-C", "nix-eval-jobs,nix,nix-daemon,nix-fast-build",
                  "-o", "pid,ppid,comm,rss,pcpu", "--sort=-rss",
              ], check=False)
              time.sleep(15)
          PY
          monitor_pid=$!
          stop_resources() {
            if kill -0 "$monitor_pid"; then
              kill "$monitor_pid"
            fi
            wait "$monitor_pid" || true
          }
          trap stop_resources EXIT

          # The build engine comes from the fleet revision, not the runner's registry.
          nix run "github:${FLEET_REPO}/${FLEET_SHA}#packages.${RUNNER_SYSTEM}.nix-fast-build" -- \
            --eval-workers 2 --eval-max-memory-size 3072 --max-jobs 4 \
            --skip-cached --systems "$SYSTEMS" --flake "${TARGETS:-.#checks}"
          echo "outcome=success" >> "$GITHUB_OUTPUT"

      - name: Report builders and realisations
        if: always()
        # Reporting, not a gate: an unavailable builder is a fact about this run, and
        # sustained failure belongs to fleet telemetry rather than a pre-flight veto.
        # Lines go to the log as well as the summary, so a run is diagnosed from its
        # log alone.
        env:
          MACHINES_FILE: /etc/nix/machines
        run: |
          set -uo pipefail
          report() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          report "### Build report"
          report ""
          report "- builder configuration: \`$(nix config show builders)\` (configured, not proof of use)"
          if [ ! -s "$MACHINES_FILE" ]; then
            report "- no builder configuration: the coordinator did not install"
            exit 0
          fi
          while read -r uri systems _rest; do
            [ -n "$uri" ] || continue
            host=${uri#ssh-ng://}
            for context in runner root; do
              if [ "$context" = root ]; then
                launcher=(sudo)
              else
                launcher=()
              fi
              if out=$("${launcher[@]}" ssh -n -o BatchMode=yes -o ConnectTimeout=8 \
                  -o StrictHostKeyChecking=accept-new "$host" true 2>&1); then
                report "- \`$host\` ($systems): $context ssh ok"
              else
                report "- \`$host\` ($systems): $context ssh failed — ${out%%$'\n'*}"
              fi
            done
          done < "$MACHINES_FILE"
          if [ -e /tmp/build-start ]; then
            logs=$(find /nix/var/log/nix/drvs -name '*.drv.bz2' -newer /tmp/build-start | wc -l)
            report "- build logs written on this runner: \`$logs\` (where derivations ran is not established by this report)"
          fi
