# Coordinated fleet build + cache push.
#
# Model: ONE coordinator runs nix-fast-build, which evaluates locally and
# distributes builds to nix remote builders (nix's own builders = ssh-ng://
# fan-out, multiple hosts, results return to the coordinator's store).
# Each remote builder publishes through its existing niks3 post-build-hook.
# GHA-local builds use niks3-action's native hook with GitHub OIDC.
# No path collection or --niks3-server upload: publication belongs to hooks.
# The coordinator installs niks3-action for its own local builds.
#
# BUILDER CONFIGURATION COMES FROM THE FLEET INVENTORY — the workflow holds
# no builder coordinates. nix-fleet (inputs.nix-fleet.flakeModules.fleet)
# is the canonical authority; the consumer flake renders its selected
# builder profile as `packages.ci` (canonical) or `packages.<profile>`
# (consumer-local sets) — machines file, known_hosts, ssh_config — and this
# workflow installs those artifacts. Consumers select the coordinator
# architecture, target systems and builder profile.
#
# REUSABLE WORKFLOW: call it from a ~10-line consumer stub —
#
#   jobs:
#     build-push-cache:
#       uses: Shrub24/nix-fleet/.github/workflows/build-push-cache.yml@v1
#       with:
#         cache_api_url: https://niks3.tailnet.example.com   # optional; the fleet contract supplies it
#         targets: .#nixosConfigurations.myhost.config.system.build.toplevel
#         builder_attr: ci            # optional; empty means local-only
#         runner_system: x86_64-linux # optional; ARM coordinator by default
#         systems: x86_64-linux       # optional; both architectures by default
#         tailnet: false              # optional; default true
#         ts_client_id: ${{ vars.TS_OAUTH_CLIENT_ID }} # optional public override
#         ts_audience: ${{ vars.TS_AUDIENCE }}         # optional public override
#       secrets:
#         BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
#
# CALLER REQUIREMENT: the calling job MUST grant `id-token: write` +
# `contents: read` (permissions cannot be elevated by a called workflow —
# GitHub rejects the call at parse time if the caller grants less).
#
# Pin to a VERSION TAG, not @main: nix-fleet cuts tagged releases and
# renovate proposes tag bumps (PR gate + changelog), so consumers opt into
# changes deliberately. Nothing else is configured per-consumer: builder
# coordinates render from the fleet inventory, cache substituter/keys/
# audience from the cache's /api/cache-config.
#
# Builder prerequisites: nixpkgs revisions aligned (consumers follow
# nix-fleet's nixpkgs input), coordinator key authorized by the builders'
# nixbuild account, substituter pointing at the cache so --skip-cached is
# meaningful. Degradation is native: an unreachable builder simply drops
# out of nix's scheduling and work lands on the remaining builders and the
# runner's own store — the inventory carries no failover logic.
name: build-push-cache
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch:
    inputs:
      runner_system:
        description: "Coordinator architecture"
        type: choice
        options: [aarch64-linux, x86_64-linux]
        required: false
        default: "aarch64-linux"
      systems:
        description: "Target systems (space-separated); independent of coordinator architecture"
        required: false
        default: "x86_64-linux aarch64-linux"
      builder_attr:
        description: "Builder profile package; empty disables remote builders"
        required: false
        default: "ci"
      targets:
        description: "Flake selection to build (defaults to .#checks)"
        required: false
        default: ".#checks"
      cache_api_url:
        description: "niks3 server base URL; empty resolves it from the fleet contract"
        required: false
        default: ""
      tailnet:
        description: "Join the tailnet before building"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves the fleet CI identity"
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty resolves the fleet CI identity"
        required: false
        default: ""
  workflow_call:
    inputs:
      runner_system:
        description: "Coordinator architecture: aarch64-linux or x86_64-linux"
        type: string
        required: false
        default: "aarch64-linux"
      systems:
        description: "Target systems (space-separated); independent of coordinator architecture"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      targets:
        description: "Flake selection to build (defaults to .#checks)"
        type: string
        required: false
        default: ".#checks"
      cache_api_url:
        description: 'niks3 server base URL; empty resolves packages.<system>.cache-api-url (fleet.services."niks3-write")'
        type: string
        required: false
        default: ""
      builder_attr:
        description: "Builder profile package; empty disables remote builders"
        type: string
        required: false
        default: "ci"
      tailnet:
        description: "Join the tailnet before building; disable for public-only deployments"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves packages.x86_64-linux.ci-tailscale"
        type: string
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty uses the selected client's audience"
        type: string
        required: false
        default: ""
    secrets:
      FLEET_BUILDER_SSH_KEY:
        description: "Repository coordinator key used by direct dispatch; reusable callers normally pass BUILDER_SSH_KEY"
        required: false
      BUILDER_SSH_KEY:
        description: "Coordinator's builder SSH key (authorized by builders' nixbuild account)"
        required: false

concurrency:
  group: build-push-cache
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.systems.outputs.systems }}
      runner: ${{ steps.systems.outputs.runner }}
      ts-client-id: ${{ steps.tailscale.outputs.client-id }}
      ts-audience: ${{ steps.tailscale.outputs.audience }}
    steps:
      - name: Check out repository
        if: ${{ inputs.tailnet && inputs.ts_client_id == '' }}
        uses: actions/checkout@v7

      - name: Install Nix
        if: ${{ inputs.tailnet && inputs.ts_client_id == '' }}
        uses: NixOS/nix-installer-action@main

      - name: Resolve public Tailscale identity
        if: ${{ inputs.tailnet }}
        id: tailscale
        env:
          CLIENT_ID: ${{ inputs.ts_client_id }}
          AUDIENCE: ${{ inputs.ts_audience }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            metadata=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.ci-tailscale)
            CLIENT_ID=$(jq -er '.clientId' "$metadata")
            if [ -z "$AUDIENCE" ]; then
              AUDIENCE=$(jq -er '.audience' "$metadata")
            fi
          elif [ -z "$AUDIENCE" ]; then
            AUDIENCE="api.tailscale.com/$CLIENT_ID"
          fi
          [[ "$CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::ci: invalid Tailscale client ID"; exit 1; }
          [[ -n "$AUDIENCE" && "$AUDIENCE" != *[[:space:]]* ]] || { echo "::error::ci: invalid Tailscale audience"; exit 1; }
          echo "client-id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "audience=$AUDIENCE" >> "$GITHUB_OUTPUT"

      - name: Select coordinator and target systems
        id: systems
        env:
          RUNNER_SYSTEM: ${{ inputs.runner_system }}
          SYSTEMS: ${{ inputs.systems }}
        run: |
          case "$RUNNER_SYSTEM" in
            aarch64-linux) runner=ubuntu-24.04-arm ;;
            x86_64-linux) runner=ubuntu-latest ;;
            *) echo "::error::ci: unsupported runner_system '$RUNNER_SYSTEM'"; exit 1 ;;
          esac
          systems=$(printf '%s' "$SYSTEMS" | jq -Rsc 'split(" ") | map(select(length > 0)) | unique')
          if ! echo "$systems" | jq -e 'length > 0 and all(.[]; . == "x86_64-linux" or . == "aarch64-linux")' > /dev/null; then
            echo "::error::ci: systems must contain x86_64-linux or aarch64-linux"
            exit 1
          fi
          echo "systems=$(echo "$systems" | jq -r 'join(" ")')" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Join tailnet (fleet-host builders)
        # MagicDNS names in the registry's machines file resolve only inside
        # the tailnet. External-only profiles pass tailnet: false; the
        # registry's ssh_config/known_hosts carry everything else.
        # Workload identity federation: the action exchanges GitHub's OIDC
        # token (from the caller's id-token: write) for a node key, so no
        # long-lived OAuth secret exists anywhere.
        if: ${{ inputs.tailnet }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ needs.prepare.outputs.ts-client-id }}
          audience: ${{ needs.prepare.outputs.ts-audience }}
          tags: tag:ci

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Install fleet builder artifacts from the registry
        if: ${{ inputs.builder_attr != '' }}
        # Builds the consumer's rendered profile bundle (nix eval only) and
        # installs machines/known_hosts/ssh_config. The workflow never
        # stores builder coordinates; the registry is the SSOT.
        run: |
          BUNDLE=$(nix build --no-link --print-out-paths \
            ".#packages.${{ inputs.runner_system }}.${{ inputs.builder_attr }}")
          mkdir -p ~/.ssh
          sudo cp "$BUNDLE/known_hosts" /etc/ssh/ssh_known_hosts
          cat "$BUNDLE/ssh_config" >> ~/.ssh/config
          cp "$BUNDLE/machines" /tmp/nix-builders

      - name: Set up coordinator SSH key
        if: ${{ inputs.builder_attr != '' }}
        env:
          BUILDER_KEY: ${{ secrets.BUILDER_SSH_KEY || secrets.FLEET_BUILDER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BUILDER_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Verify the selected builders answer before scheduling
        if: ${{ inputs.builder_attr != '' }}
        # A builder that cannot be dialled surfaces deep inside the build as a
        # bare "platform mismatch". Prove dial-in here, name the host, and fail
        # only when a requested system is left with nowhere to build — the
        # coordinator covers its own system locally.
        env:
          SYSTEMS: ${{ needs.prepare.outputs.systems }}
          COORDINATOR: ${{ inputs.runner_system }}
        run: |
          set -euo pipefail
          # machines line: <uri> <systems> <key> <maxjobs> <speedfactor> <features> <mandatory>
          reachable=""
          while read -r uri systems _rest; do
            if [ -z "$uri" ]; then
              continue
            fi
            host=${uri#ssh-ng://}
            host=${host#ssh://}
            if ssh -n -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$host" true; then
              echo "builder ok: $host ($systems)"
              reachable="$reachable ${systems//,/ }"
            else
              echo "::warning::ci: builder '$host' did not answer ssh (serves $systems)"
            fi
          done < /tmp/nix-builders

          uncovered=""
          for system in $SYSTEMS; do
            if [ "$system" = "$COORDINATOR" ]; then
              continue
            fi
            case " $reachable " in
              *" $system "*) ;;
              *) uncovered="$uncovered $system" ;;
            esac
          done
          if [ -n "$uncovered" ]; then
            echo "::error::ci: no reachable builder serves:$uncovered (coordinator is $COORDINATOR)"
            exit 1
          fi

      - name: Resolve cache API URL
        # The fleet contract already carries this coordinate
        # (fleet.services."niks3-write"), so the input is an override rather
        # than something every repository restates.
        id: cache-url
        run: |
          url='${{ inputs.cache_api_url }}'
          if [ -z "$url" ]; then
            bundle=$(nix build --no-link --print-out-paths ".#packages.${{ inputs.runner_system }}.cache-api-url")
            url=$(cat "$bundle")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ steps.cache-url.outputs.url }}

      - name: Build with the selected builder profile
        env:
          BUILDER_ATTR: ${{ inputs.builder_attr }}
          SYSTEMS: ${{ needs.prepare.outputs.systems }}
          TARGETS: ${{ inputs.targets }}
        run: |
          builders=""
          if [ -n "$BUILDER_ATTR" ]; then
            builders="@/tmp/nix-builders"
          fi
          export NIX_CONFIG="${NIX_CONFIG:-}
          builders = $builders
          max-jobs = 1"
          # Stream diagnostics: a runner shutdown may prevent artifact upload.
          python3 -u - <<'PY' &
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import time

          while True:
              memory = dict(line.split(":", 1) for line in Path("/proc/meminfo").read_text().splitlines())
              vm = dict(line.split() for line in Path("/proc/vmstat").read_text().splitlines())
              disk = shutil.disk_usage("/nix/store")
              print(
                  f"ci resources {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}: "
                  f"MemAvailable={memory['MemAvailable'].strip()} "
                  f"MemTotal={memory['MemTotal'].strip()} "
                  f"SwapFree={memory['SwapFree'].strip()} "
                  f"SwapTotal={memory['SwapTotal'].strip()} "
                  f"oom_kill={vm['oom_kill']} "
                  f"store_free_MiB={disk.free // 2**20} load={os.getloadavg()}"
              )
              subprocess.run([
                  "ps", "-C", "nix-eval-jobs,nix,nix-daemon,nix-fast-build",
                  "-o", "pid,ppid,comm,rss,pcpu", "--sort=-rss",
              ], check=False)
              time.sleep(15)
          PY
          monitor_pid=$!
          stop_resources() {
            if kill -0 "$monitor_pid"; then
              kill "$monitor_pid"
            fi
            wait "$monitor_pid" || true
          }
          trap stop_resources EXIT

          nix run nixpkgs#nix-fast-build -- \
            --eval-workers 2 --eval-max-memory-size 2048 --max-jobs 4 \
            --skip-cached --systems "$SYSTEMS" --flake "${TARGETS:-.#checks}"
