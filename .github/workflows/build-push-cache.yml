# Coordinated fleet build + cache push.
#
# Model: ONE coordinator runs nix-fast-build, which evaluates locally and
# distributes builds to nix remote builders (nix's own builders = ssh-ng://
# fan-out, multiple hosts, results return to the coordinator's store). The
# coordinator then pushes what it holds to niks3 once — server-side
# deduplication makes overlap with anything builders pushed themselves
# harmless. nix-fast-build's --niks3-server does the same thing via
# `niks3 push` after the build; auth is GitHub OIDC — the refresher loop
# below mints tokens bound to the cache audience into the file niks3
# re-reads periodically (nix-fast-build itself never sees OIDC).
#
# GHA-local builds (capacity permitting) stay on niks3-action, which
# registers a post-build-hook and streams uploads with GitHub OIDC; both
# paths converge on the same deduplicating server.
#
# BUILDER CONFIGURATION COMES FROM THE FLEET INVENTORY — the workflow holds
# no builder coordinates. nix-fleet (inputs.nix-fleet.flakeModules.fleet)
# is the canonical authority; the consumer flake renders its selected
# builder profile as `packages.ci` (canonical) or `packages.<profile>`
# (consumer-local sets) — machines file, known_hosts, ssh_config — and this
# workflow installs those artifacts. The only selection the workflow makes
# is the builder-set name.
#
# REUSABLE WORKFLOW: call it from a ~10-line consumer stub —
#
#   jobs:
#     build-push-cache:
#       uses: Shrub24/nix-fleet/.github/workflows/build-push-cache.yml@v1
#       with:
#         cache_api_url: https://niks3.tailnet.example.com   # optional; the fleet contract supplies it
#         targets: .#nixosConfigurations.myhost.config.system.build.toplevel
#         builder_attr: ci            # optional, canonical profile by default
#         gha_systems: x86_64-linux   # optional, add aarch64-linux for arm
#         tailnet: false              # optional; default true
#         ts_client_id: ${{ vars.TS_OAUTH_CLIENT_ID }} # optional public override
#         ts_audience: ${{ vars.TS_AUDIENCE }}         # optional public override
#       secrets:
#         BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
#
# CALLER REQUIREMENT: the calling job MUST grant `id-token: write` +
# `contents: read` (permissions cannot be elevated by a called workflow —
# GitHub rejects the call at parse time if the caller grants less).
#
# Pin to a VERSION TAG, not @main: nix-fleet cuts tagged releases and
# renovate proposes tag bumps (PR gate + changelog), so consumers opt into
# changes deliberately. Nothing else is configured per-consumer: builder
# coordinates render from the fleet inventory, cache substituter/keys/
# audience from the cache's /api/cache-config.
#
# Builder prerequisites: nixpkgs revisions aligned (consumers follow
# nix-fleet's nixpkgs input), coordinator key authorized by the builders'
# nixbuild account, substituter pointing at the cache so --skip-cached is
# meaningful. Degradation is native: an unreachable builder simply drops
# out of nix's scheduling and work lands on the remaining builders and the
# runner's own store — the inventory carries no failover logic.
name: build-push-cache
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Flake attrspecs to build (space-separated)"
        required: false
        default: ""
      cache_api_url:
        description: "niks3 server base URL; empty resolves it from the fleet contract"
        required: false
        default: ""
      tailnet:
        description: "Join the tailnet before building"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves the fleet CI identity"
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty resolves the fleet CI identity"
        required: false
        default: ""
  workflow_call:
    inputs:
      targets:
        description: "Flake attrspecs to build (space-separated)"
        type: string
        required: false
      cache_api_url:
        description: 'niks3 server base URL; empty resolves packages.<system>.cache-api-url (fleet.services."niks3-write")'
        type: string
        required: false
        default: ""
      builder_attr:
        description: "fleet.builderSets entry to schedule against (attr of packages.<attr>)"
        type: string
        required: false
        default: "ci"
      gha_systems:
        description: "Systems the GHA-local build job matrixes over"
        type: string
        required: false
        default: "x86_64-linux"
      tailnet:
        description: "Join the tailnet before building; disable for public-only deployments"
        type: boolean
        required: false
        default: true
      ts_client_id:
        description: "Public Tailscale client ID; empty resolves packages.x86_64-linux.ci-tailscale"
        type: string
        required: false
        default: ""
      ts_audience:
        description: "Public Tailscale audience; empty uses the selected client's audience"
        type: string
        required: false
        default: ""
    secrets:
      BUILDER_SSH_KEY:
        description: "Coordinator's builder SSH key (authorized by builders' nixbuild account)"
        required: false

concurrency:
  group: build-push-cache
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.norm.outputs.systems }}
      ts-client-id: ${{ steps.tailscale.outputs.client-id }}
      ts-audience: ${{ steps.tailscale.outputs.audience }}
    steps:
      - name: Check out repository
        if: ${{ inputs.tailnet && inputs.ts_client_id == '' }}
        uses: actions/checkout@v7

      - name: Install Nix
        if: ${{ inputs.tailnet && inputs.ts_client_id == '' }}
        uses: NixOS/nix-installer-action@main

      - name: Resolve public Tailscale identity
        if: ${{ inputs.tailnet }}
        id: tailscale
        env:
          CLIENT_ID: ${{ inputs.ts_client_id }}
          AUDIENCE: ${{ inputs.ts_audience }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            metadata=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.ci-tailscale)
            CLIENT_ID=$(jq -er '.clientId' "$metadata")
            if [ -z "$AUDIENCE" ]; then
              AUDIENCE=$(jq -er '.audience' "$metadata")
            fi
          elif [ -z "$AUDIENCE" ]; then
            AUDIENCE="api.tailscale.com/$CLIENT_ID"
          fi
          [[ "$CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::ci: invalid Tailscale client ID"; exit 1; }
          [[ -n "$AUDIENCE" && "$AUDIENCE" != *[[:space:]]* ]] || { echo "::error::ci: invalid Tailscale audience"; exit 1; }
          echo "client-id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "audience=$AUDIENCE" >> "$GITHUB_OUTPUT"

      - id: norm
        run: |
          SYSTEMS=$(echo "${{ inputs.gha_systems }}" | tr ' ' '\n' | jq -R . | jq -sc .)
          echo "systems=$SYSTEMS" >> "$GITHUB_OUTPUT"

  fleet-build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Join tailnet (fleet-host builders)
        # MagicDNS names in the registry's machines file resolve only inside
        # the tailnet. External-only profiles pass tailnet: false; the
        # registry's ssh_config/known_hosts carry everything else.
        # Workload identity federation: the action exchanges GitHub's OIDC
        # token (from the caller's id-token: write) for a node key, so no
        # long-lived OAuth secret exists anywhere.
        if: ${{ inputs.tailnet }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ needs.prepare.outputs.ts-client-id }}
          audience: ${{ needs.prepare.outputs.ts-audience }}
          tags: tag:ci

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Install fleet builder artifacts from the registry
        # Builds the consumer's rendered profile bundle (nix eval only) and
        # installs machines/known_hosts/ssh_config. The workflow never
        # stores builder coordinates; the registry is the SSOT.
        run: |
          BUNDLE=$(nix build --no-link --print-out-paths \
            ".#packages.x86_64-linux.${{ inputs.builder_attr }}")
          mkdir -p ~/.ssh
          sudo cp "$BUNDLE/known_hosts" /etc/ssh/ssh_known_hosts
          cat "$BUNDLE/ssh_config" >> ~/.ssh/config
          cp "$BUNDLE/machines" /tmp/nix-builders

      - name: Set up coordinator SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Resolve cache API URL
        # The fleet contract already carries this coordinate
        # (fleet.services."niks3-write"), so the input is an override rather
        # than something every repository restates.
        id: cache-url
        run: |
          url='${{ inputs.cache_api_url }}'
          if [ -z "$url" ]; then
            bundle=$(nix build --no-link --print-out-paths .#packages.x86_64-linux.cache-api-url)
            url=$(cat "$bundle")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Fetch cache config
        # Same endpoint the action uses: substituter, public keys, audience.
        id: cache
        run: |
          curl -sS "${{ steps.cache-url.outputs.url }}/api/cache-config?issuer=https://token.actions.githubusercontent.com" \
            | jq -r '"substituter=" + .substituter_url, "public_keys=" + (.public_keys | join(" ")), "audience=" + .oidc_audience' \
            >> "$GITHUB_OUTPUT"

      - name: Start OIDC token refresher for niks3 push
        # niks3-action's auth-token-script output is daemon-mode-only, so we
        # mint directly: GitHub exposes ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN to
        # jobs with id-token: write; a background loop refreshes
        # $XDG_CONFIG_HOME/niks3/auth-token (niks3 re-reads the file
        # periodically) so the coordinator's `niks3 push` via
        # nix-fast-build --niks3-server always carries a current token bound
        # to the cache audience.
        run: |
          mkdir -p ~/.config/niks3
          cat > /tmp/refresh-oidc.sh <<'REFRESH'
          #!/usr/bin/env bash
          set -euo pipefail
          while true; do
            token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ steps.cache.outputs.audience }}" | jq -r .value)
            printf '%s' "$token" > "$HOME/.config/niks3/auth-token"
            sleep 180
          done
          REFRESH
          chmod +x /tmp/refresh-oidc.sh
          /tmp/refresh-oidc.sh &
          echo "REFRESHER_PID=$!" >> "$GITHUB_ENV"

      - name: Evaluate and distribute builds to fleet builders
        # Fan-out via nix's builders mechanism: nix schedules derivations
        # across the registry's builders AND the runner's own local store
        # (default max-jobs — the runner is just another builder; GHA local
        # capacity participates, and its aarch64 runners cover arm builds
        # fleet hosts cannot). Builders with the niks3 post-build-hook push
        # their work as it lands; results returning to the runner are pushed
        # by --niks3-server. niks3's server-side dedup/queueing makes the
        # overlap a no-op.
        env:
          NIX_CONFIG: |
            builders = @/tmp/nix-builders
            substituters = ${{ steps.cache.outputs.substituter }}
            trusted-public-keys = ${{ steps.cache.outputs.public_keys }}
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --no-nom --skip-cached \
            --flake .# ${{ inputs.targets }}

  gha-build:
    needs: prepare
    strategy:
      matrix:
        system: ${{ fromJSON(needs.prepare.outputs.systems) }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Join tailnet (cache API is tailnet-only)
        # gha-build fetches /api/cache-config and streams uploads to the
        # API host — both unreachable without the tailnet. Same gate as
        # fleet-build; pass tailnet: false for public-reachable deployments.
        # Same federated identity as fleet-build: no OAuth secret.
        if: ${{ inputs.tailnet }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ needs.prepare.outputs.ts-client-id }}
          audience: ${{ needs.prepare.outputs.ts-audience }}
          tags: tag:ci

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Resolve cache API URL
        # Same contract-derived coordinate as fleet-build; the matrix system
        # picks the package attribute.
        id: cache-url
        run: |
          url='${{ inputs.cache_api_url }}'
          if [ -z "$url" ]; then
            bundle=$(nix build --no-link --print-out-paths ".#packages.${{ matrix.system }}.cache-api-url")
            url=$(cat "$bundle")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure cache (substituter + OIDC post-build-hook)
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ steps.cache-url.outputs.url }}

      - name: Build (locally, streaming uploads)
        run: nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --flake .# ${{ inputs.targets }}
