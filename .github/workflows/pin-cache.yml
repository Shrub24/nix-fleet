# Moves the fleet's rolling cache pins to a promoted revision. Dispatched by
# promote-candidate.yml; see docs/runbooks/cache-pins.md.
name: pin-cache

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Commit to pin; empty pins the triggering revision"
        type: string
        required: false
        default: ""
      pin_name:
        description: "Pin name prefix, one pin per system as <prefix>-<system>; empty falls back to CACHE_PIN_NAME"
        type: string
        required: false
        default: ""
      systems:
        description: "Target systems, space-separated"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      targets:
        description: "Flake selection whose <targets>.<system>.<subject> is pinned"
        type: string
        required: false
        default: ".#packages"
      subject:
        description: "Attribute of each system that names the aggregate to pin"
        type: string
        required: false
        default: "cache-root"
      cache_api_url:
        description: "Private API URL; empty resolves .#packages.<runner_system>.cache-api-url"
        type: string
        required: false
        default: ""
      runner_system:
        description: "Nix system used to resolve the fleet artifacts"
        type: string
        required: false
        default: "x86_64-linux"
  workflow_call:
    inputs:
      revision:
        description: "Commit to pin; empty pins the triggering revision"
        type: string
        required: false
        default: ""
      pin_name:
        description: "Pin name prefix, one pin per system as <prefix>-<system>; empty falls back to CACHE_PIN_NAME"
        type: string
        required: false
        default: ""
      systems:
        description: "Target systems, space-separated"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      targets:
        description: "Flake selection whose <targets>.<system>.<subject> is pinned"
        type: string
        required: false
        default: ".#packages"
      subject:
        description: "Attribute of each system that names the aggregate to pin"
        type: string
        required: false
        default: "cache-root"
      cache_api_url:
        description: "Private API URL; empty resolves .#packages.<runner_system>.cache-api-url"
        type: string
        required: false
        default: ""
      runner_system:
        description: "Nix system used to resolve the fleet artifacts"
        type: string
        required: false
        default: "x86_64-linux"

permissions:
  contents: read
  id-token: write

concurrency:
  group: pin-cache
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision to pin
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      # The coordinator pattern: the fleet revision is the one that defines this
      # workflow, so coordinates come from nix-fleet and only the subject comes from
      # the caller's flake.
      - name: Resolve the fleet revision
        id: fleet
        env:
          FLEET_REPO: ${{ job.workflow_repository }}
          FLEET_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$FLEET_REPO" ] || [ -z "$FLEET_SHA" ]; then
            echo "::error::pin-cache: cannot resolve the fleet revision (job.workflow_repository / job.workflow_sha are empty)"
            exit 1
          fi
          echo "ref=github:$FLEET_REPO/$FLEET_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve public Tailscale identity
        id: ts
        env:
          RUNNER_SYSTEM: ${{ inputs.runner_system || 'x86_64-linux' }}
          FLEET: ${{ steps.fleet.outputs.ref }}
        run: |
          metadata=$(nix build --no-link --print-out-paths "$FLEET#packages.$RUNNER_SYSTEM.ci-tailscale")
          echo "client-id=$(jq -er '.clientId' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "audience=$(jq -er '.audience' "$metadata")" >> "$GITHUB_OUTPUT"

      - name: Join tailnet (cache write API)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.ts.outputs.client-id }}
          audience: ${{ steps.ts.outputs.audience }}
          tags: tag:ci

      - name: Resolve the cache API URL
        id: api
        env:
          API_URL: ${{ inputs.cache_api_url }}
          RUNNER_SYSTEM: ${{ inputs.runner_system || 'x86_64-linux' }}
          FLEET: ${{ steps.fleet.outputs.ref }}
        run: |
          url=$API_URL
          if [ -z "$url" ]; then
            url=$(nix build --no-link --print-out-paths "$FLEET#packages.$RUNNER_SYSTEM.cache-api-url")
            url=$(cat "$url")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Configure the cache client
        id: niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ steps.api.outputs.url }}
          skip-push: true

      - name: Pin one aggregate root per system
        env:
          SYSTEMS: ${{ inputs.systems || 'x86_64-linux aarch64-linux' }}
          REVISION: ${{ inputs.revision || github.sha }}
          TARGETS: ${{ inputs.targets || '.#packages' }}
          SUBJECT: ${{ inputs.subject || 'cache-root' }}
          PIN: ${{ inputs.pin_name || vars.CACHE_PIN_NAME }}
          API: ${{ steps.api.outputs.url }}
          BINARY_DIR: ${{ steps.niks3.outputs.binary-dir }}
          TOKEN_SCRIPT: ${{ steps.niks3.outputs.auth-token-script }}
        run: |
          set -euo pipefail
          # An empty name would create pins called "-x86_64-linux".
          [ -n "$PIN" ] || { echo "::error::pin-cache: no pin name (input or CACHE_PIN_NAME)"; exit 1; }
          # `auto` derives the prefix from the repository, so a consumer needs no
          # variable; pin names share one server-side registry, so per-repo prefixes
          # keep the cache's `pins` rule narrow.
          if [ "$PIN" = auto ]; then PIN="${GITHUB_REPOSITORY#*/}-main"; fi
          for system in $SYSTEMS; do
            root=$(nix eval --raw "$TARGETS.$system.$SUBJECT.outPath")
            # Flags precede the positional arguments: niks3 parses with Go's flag
            # package, which stops at the first non-flag word.
            "$BINARY_DIR/niks3" pins create \
              --server-url "$API" \
              --auth-token-script "$TOKEN_SCRIPT" \
              "$PIN-$system" "$root"
          done
          {
            echo "### Pins moved for \`${REVISION}\`"
            echo ""
            echo "- name: \`$PIN-<system>\`"
            echo "- systems: $SYSTEMS"
          } >> "$GITHUB_STEP_SUMMARY"
