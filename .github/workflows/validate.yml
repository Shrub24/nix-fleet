# The repository's validation, in one definition: ci.yml calls it for feedback and
# pipeline.yml from the default branch for the required status. The revision is data.
name: validate

on:
  workflow_call:
    inputs:
      revision:
        description: "Commit to validate"
        type: string
        required: true
      generated_files:
        description: "check fails when regeneration would change the tree; skip leaves that to candidate preparation"
        type: string
        required: false
        default: check

jobs:
  # Three jobs so one failure cannot hide the others.
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting (pinned tooling base)
        working-directory: target
        run: nix build --no-link .#checks.x86_64-linux.treefmt

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Evaluate all systems
        uses: $/.github/actions/validate-flake
        with:
          flake: target

  consistency:
    if: ${{ inputs.generated_files == 'check' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Check out the preparation action
        # The fleet's own revisions are guarded by its default branch; any other caller
        # runs the action bundled with the workflow revision it pinned.
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ github.repository == job.workflow_repository && 'main' || job.workflow_sha }}
          path: trusted
          sparse-checkout: .github/actions/prepare-candidate
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generated flake and lock are current
        uses: ./trusted/.github/actions/prepare-candidate
        with:
          mode: check
          directory: target
