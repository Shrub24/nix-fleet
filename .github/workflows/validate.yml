# The repository's validation, in one definition: ci.yml calls it for feedback and
# pipeline.yml from the default branch for the required status. The revision is data.
name: validate

on:
  workflow_call:
    inputs:
      revision:
        description: "Commit to validate"
        type: string
        required: true
      generated_files:
        description: "check fails when regeneration would change the tree; skip leaves that to candidate preparation"
        type: string
        required: false
        default: check

jobs:
  # Three jobs so one failure cannot hide the others.
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting (pinned tooling base)
        working-directory: target
        run: nix build --no-link .#checks.x86_64-linux.treefmt

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Evaluate all systems
        working-directory: target
        run: nix flake check --no-build --no-write-lock-file --all-systems

  consistency:
    if: ${{ inputs.generated_files == 'check' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: target

      - name: Check out the preparation script from the fleet's default branch
        # The trusted copy of the procedure runs even if the revision rewrote its own:
        # it comes from the fleet's default branch, not from this run's ref, which for
        # a pull request is that pull request's merge commit.
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generated flake and lock are current
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/trusted/.github/scripts/prepare-candidate.sh" --check
