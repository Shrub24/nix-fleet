# Scheduled native producer: refresh moving flake inputs, run the registered package
# updaters, and propose one pull request. The proposal is a source for the candidate
# pipeline, not an acceptance. Contract: docs/contracts/package-updates.md.
name: package-updates-refresh

on:
  schedule:
    # Daily: moving inputs move daily.
    - cron: "43 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-updates-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.evaluate.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Initialise jj for staging
        # Updaters stage in jj workspaces; colocation keeps git authoritative.
        run: nix shell nixpkgs#jujutsu --command jj git init --colocate

      - name: Refresh flake inputs and registered packages
        id: run
        # The report is the evidence, not the exit status: an uncaught error also
        # exits 1. Reports stay outside the checkout.
        run: |
          set -euo pipefail
          echo "propose=false" >> "$GITHUB_OUTPUT"
          set +e
          nix run .#update-packages -- --refresh-inputs \
            --json "$RUNNER_TEMP/report.json" \
            --markdown "$RUNNER_TEMP/pr-body.md"
          code=$?
          set -e
          outcome=$(jq -r '.outcome // "none"' "$RUNNER_TEMP/report.json" 2>/dev/null || echo none)
          echo "batch exit $code, outcome $outcome"
          # The status and the report must agree, and both artifacts must exist:
          # the report is written before the pull-request body, so a completed
          # report about a run that then failed would otherwise propose a tree.
          case "$outcome:$code" in
            complete:0|partial:1)
              for artifact in report.json pr-body.md; do
                [ -s "$RUNNER_TEMP/$artifact" ] || {
                  echo "::error::the run reported $outcome but $artifact is missing or empty"
                  exit 2
                }
              done
              echo "propose=true" >> "$GITHUB_OUTPUT"
              if [ "$outcome" = partial ]; then
                echo "::warning::the refresh completed with failures; the pull request lists them"
              fi
              ;;
            *) echo "::error::nothing to propose (exit $code, outcome $outcome)"; exit 2 ;;
          esac

      - name: Show the refresh report
        if: always()
        run: cat "$RUNNER_TEMP/report.json" 2>/dev/null || echo "no report written"

      - name: Record the proposal
        id: propose
        if: ${{ steps.run.outputs.propose == 'true' }}
        run: |
          set -euo pipefail
          git add -A .
          if git diff --cached --quiet; then
            echo "patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          echo "patch=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate the refreshed tree
        if: ${{ steps.propose.outputs.patch == 'true' }}
        uses: $/.github/actions/validate-flake

      - name: Approve the evaluated proposal
        id: evaluate
        if: ${{ success() && steps.propose.outputs.patch == 'true' }}
        run: echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload the proposal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-updates-proposal
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/pr-body.md
            ${{ runner.temp }}/changes.patch
          if-no-files-found: ignore

  publish:
    needs: update
    # Runs after a failed `update` job too: a partial refresh is proposable.
    if: ${{ !cancelled() && needs.update.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    # The environment holds the App key and admits only the default branch, so it
    # is unreachable from a pull-request job. This job runs no repository code: it
    # checks out the base, applies the proposal as data and opens the pull request.
    environment: automation
    steps:
      - name: Check out the base the refresh ran on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the proposal
        uses: actions/download-artifact@v8
        with:
          name: package-updates-proposal
          path: ${{ runner.temp }}

      - name: Refuse a moved base
        # The patch is only correct against the revision it was taken from: a
        # wholesale lock rewrite applied to a newer lock would revert what landed
        # in between. Failing visibly is recovered by the next run.
        env:
          BASE: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          tip=$(git rev-parse "origin/$BRANCH")
          if [ "$tip" != "$BASE" ]; then
            echo "::error::$BRANCH moved from $BASE to $tip; the next run redoes this refresh"
            exit 1
          fi

      - name: Apply the proposal
        run: git apply --verbose "$RUNNER_TEMP/changes.patch"

      - name: Mint the automation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token }}
          # The base was checked out by commit, so the base branch is stated here;
          # create-pull-request refuses a detached checkout without it.
          base: ${{ github.ref_name }}
          branch: automation/package-updates
          commit-message: "chore(deps): refresh flake inputs and registered package pins"
          title: "chore(deps): refresh flake inputs and registered package pins"
          body-path: ${{ runner.temp }}/pr-body.md
          # Both labels must already exist in the repository: adding a label the
          # repository does not have returns 404 and fails this step.
          labels: |
            dependencies
            automated
