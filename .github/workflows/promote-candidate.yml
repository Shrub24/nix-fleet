# Fast-forwards main to a validated update candidate, then retains its artefacts.
name: promote-candidate

on:
  status:
  workflow_call:
    inputs:
      systems:
        description: "Systems whose retention roots were included in the approved build"
        type: string
        default: ""
      targets:
        description: "Retention selection; empty uses CACHE_PIN_TARGETS or .#packages"
        type: string
        default: ""
      subject:
        description: "Aggregate attribute; empty uses CACHE_PIN_SUBJECT or cache-root"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: promote-candidate
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.context == 'update-candidate' && github.event.state == 'success' }}
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
    outputs:
      promoted_sha: ${{ steps.promote.outputs.promoted_sha }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Mint the automation token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Fast-forward main to the candidate
        id: promote
        uses: $/.github/actions/promote-candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE: ${{ github.event.sha }}
          APP_LOGIN: ${{ vars.AUTOMATION_APP_SLUG }}[bot]
          POLICY: ${{ vars.PROMOTION_POLICY || 'auto' }}

  pin:
    needs: promote
    if: ${{ needs.promote.outputs.promoted_sha != '' && vars.CACHE_PIN_NAME != '' }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/pin-cache.yml
    with:
      revision: ${{ needs.promote.outputs.promoted_sha }}
      pin_name: ${{ vars.CACHE_PIN_NAME }}
      systems: ${{ inputs.systems || vars.CANDIDATE_SYSTEMS || 'x86_64-linux aarch64-linux' }}
      targets: ${{ inputs.targets || vars.CACHE_PIN_TARGETS || '.#packages' }}
      subject: ${{ inputs.subject || vars.CACHE_PIN_SUBJECT || 'cache-root' }}
