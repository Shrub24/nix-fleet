# Fast-forwards main to a validated candidate. Runs from the default branch on a
# `status` event; see docs/contracts/update-candidates.md.
name: promote-candidate

on:
  status:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: promote-candidate
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event.context == 'update-candidate' && github.event.state == 'success' }}
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Mint the automation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Fast-forward main to the candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE: ${{ github.event.sha }}
          APP_LOGIN: ${{ vars.AUTOMATION_APP_SLUG }}[bot]
          POLICY: ${{ vars.PROMOTION_POLICY || 'auto' }}
        run: .github/scripts/promote-candidate.sh

      - name: Move the cache pins to the promoted revision
        if: ${{ vars.CACHE_PIN_NAME != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE: ${{ github.event.sha }}
        run: |
          set -euo pipefail
          gh workflow run pin-cache.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f revision="$CANDIDATE" || \
            echo "::warning::could not queue pin-cache for $CANDIDATE; dispatch it by hand"
