# Post-merge cache diagnostic. Never gates promotion; see docs/contracts/ci.md.
name: verify-cache

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: "Commit to verify; empty verifies the triggering revision"
        type: string
        required: false
        default: ""
      targets:
        description: "Flake selection to verify; one root per attribute (defaults to .#packages)"
        type: string
        required: false
        default: ".#packages"
      systems:
        description: "Target systems, space-separated"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      cache_url:
        description: "Substituter URL; empty resolves it from the fleet revision that defines this workflow"
        type: string
        required: false
        default: ""
      runner_system:
        description: "Nix system used to resolve the cache URL artifact"
        type: string
        required: false
        default: "x86_64-linux"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache: ${{ steps.cache.outputs.url }}
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      # The fleet revision that defines this workflow supplies the cache route, so a
      # caller needs no fleet input and no fleet artifact in its own flake.
      - name: Resolve the fleet revision
        id: fleet
        env:
          FLEET_REPO: ${{ job.workflow_repository }}
          FLEET_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "$FLEET_REPO" ] || [ -z "$FLEET_SHA" ]; then
            echo "::error::verify-cache: cannot resolve the fleet revision (job.workflow_repository / job.workflow_sha are empty)"
            exit 1
          fi
          echo "ref=github:$FLEET_REPO/$FLEET_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve the substituter URL
        id: cache
        env:
          CACHE_URL: ${{ inputs.cache_url }}
          RUNNER_SYSTEM: ${{ inputs.runner_system || 'x86_64-linux' }}
          FLEET: ${{ steps.fleet.outputs.ref }}
        run: |
          url=$CACHE_URL
          if [ -z "$url" ]; then
            url=$(nix build --no-link --print-out-paths "$FLEET#packages.$RUNNER_SYSTEM.cache-substituter-url")
            url=$(cat "$url")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report whether the cache serves every realised root
        env:
          SYSTEMS: ${{ inputs.systems || 'x86_64-linux aarch64-linux' }}
          TARGETS: ${{ inputs.targets || '.#packages' }}
          CACHE: ${{ steps.cache.outputs.url }}
        run: |
          set -euo pipefail
          missing=0
          checked=0
          for system in $SYSTEMS; do
            roots=$(nix eval --raw "$TARGETS.$system" \
              --apply 'cs: builtins.concatStringsSep "\n" (builtins.map (n: (builtins.getAttr n cs).outPath) (builtins.attrNames cs))')
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              checked=$((checked + 1))
              if ! nix path-info --store "$CACHE" "$path" >/dev/null 2>&1; then
                echo "::notice::verify-cache: $CACHE does not serve $path ($system)"
                missing=$((missing + 1))
              fi
            done <<< "$roots"
          done
          {
            echo "### Cache status of \`${GITHUB_SHA}\` in $CACHE"
            echo ""
            echo "- roots checked: $checked"
            echo "- unserved: $missing"
          } >> "$GITHUB_STEP_SUMMARY"
          # Coverage is reported, never enforced: presence is asserted fail-closed by
          # pin-cache.yml at promotion. Only a failure of this job's own work is red.
          if [ "$missing" -gt 0 ]; then
            echo "::notice::verify-cache: $missing of $checked store path(s) missing from $CACHE; pin-cache asserts presence at promotion"
            exit 0
          fi
          echo "verify-cache: $CACHE serves every root of $TARGETS for $SYSTEMS ($checked roots)"
