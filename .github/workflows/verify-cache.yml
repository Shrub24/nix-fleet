# Post-merge cache diagnostic. Never gates promotion; see docs/contracts/ci.md.
name: verify-cache

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: "Commit to verify; empty verifies the triggering revision"
        type: string
        required: false
        default: ""
      targets:
        description: "Flake selection to verify (defaults to .#checks)"
        type: string
        required: false
        default: ".#checks"
      systems:
        description: "Target systems, space-separated"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      cache_url:
        description: "Substituter URL; empty resolves .#packages.<runner_system>.cache-substituter-url"
        type: string
        required: false
        default: ""
      runner_system:
        description: "Nix system used to resolve the cache URL artifact"
        type: string
        required: false
        default: "x86_64-linux"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache: ${{ steps.cache.outputs.url }}
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      - name: Resolve the substituter URL
        id: cache
        env:
          CACHE_URL: ${{ inputs.cache_url }}
          RUNNER_SYSTEM: ${{ inputs.runner_system || 'x86_64-linux' }}
        run: |
          url=$CACHE_URL
          if [ -z "$url" ]; then
            url=$(nix build --no-link --print-out-paths ".#packages.$RUNNER_SYSTEM.cache-substituter-url")
            url=$(cat "$url")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Require the cache to serve every realised root
        env:
          SYSTEMS: ${{ inputs.systems || 'x86_64-linux aarch64-linux' }}
          TARGETS: ${{ inputs.targets || '.#checks' }}
          CACHE: ${{ steps.cache.outputs.url }}
        run: |
          set -euo pipefail
          missing=0
          checked=0
          for system in $SYSTEMS; do
            roots=$(nix eval --raw "$TARGETS.$system" \
              --apply 'cs: builtins.concatStringsSep "\n" (builtins.map (n: (builtins.getAttr n cs).outPath) (builtins.attrNames cs))')
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              checked=$((checked + 1))
              if ! nix path-info --store "$CACHE" "$path" >/dev/null 2>&1; then
                echo "::error::verify-cache: $CACHE does not serve $path ($system)"
                missing=$((missing + 1))
              fi
            done <<< "$roots"
          done
          {
            echo "### Cache status of \`${GITHUB_SHA}\` in $CACHE"
            echo ""
            echo "- roots checked: $checked"
            echo "- unserved: $missing"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "::error::verify-cache: $missing of $checked store path(s) missing from $CACHE"
            echo "::notice::a revision no build realised reports its changed derivations here; a promoted revision was built, so a miss there is a loss to investigate"
            exit 1
          fi
          echo "verify-cache: $CACHE serves every root of $TARGETS for $SYSTEMS ($checked roots)"
