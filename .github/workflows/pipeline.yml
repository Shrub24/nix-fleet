# Entry point of the candidate pipeline, defined on the default branch so a pull
# request cannot change it. Routes automation sources, human revisions and pushes to
# main. Contract: docs/contracts/update-candidates.md.
name: pipeline

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_pr:
        description: "Pull request number to validate"
        required: true
        type: string
  workflow_call:
    inputs:
      source_pr:
        description: "pull request to validate; needed only when the caller's event is a dispatch"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.workflow_run.head_sha || inputs.source_pr }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      sha: ${{ steps.resolve.outputs.sha }}
      pr: ${{ steps.resolve.outputs.pr }}
      conclusion: ${{ steps.resolve.outputs.conclusion }}
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - name: Resolve the revision and its pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_PR: ${{ inputs.source_pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APP_SLUG: ${{ vars.AUTOMATION_APP_SLUG }}
          EXTRA_AUTHORS: ${{ vars.AUTOMATION_UPDATE_AUTHORS }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # A branch prefix routes a proposal; this authorises one.
          allowed=$(printf '%s\n' "${APP_SLUG}[bot]" "renovate[bot]" \
            "$(printf '%s' "${EXTRA_AUTHORS:-}" | tr ' ' '\n')" |
            jq -R -s 'split("\n") | map(select(length > 0))')

          if [ "$EVENT_NAME" != workflow_run ]; then
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$DISPATCH_PR")
            sha=$(jq -r .head.sha <<< "$pull")
            conclusion=success
          else
            sha=$EVENT_SHA
            conclusion=$EVENT_CONCLUSION
            # A fork revision's code is not ours.
            if [ "$EVENT_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::notice::pipeline: $EVENT_REPO is not this repository; nothing to do"
              emit kind none; exit 0
            fi
            if [ "$EVENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
              # No checkout here, so gh needs the repository explicitly.
              include=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                --json number,headRefName,headRefOid,author |
                jq -c --argjson allowed "$allowed" \
                  '[.[] | select((.headRefName | test("^(automation|renovate)/"))
                                 and (.author.login as $a | $allowed | index($a) != null))
                        | {source_sha: .headRefOid, source_pr: .number}]')
              emit kind main-push
              emit conclusion "$conclusion"
              emit include "$include"
              exit 0
            fi
            pull=$(gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${EVENT_BRANCH}&per_page=100" \
              --jq "[.[] | select(.head.sha == \"$sha\")][0] // empty")
          fi

          if [ -z "$pull" ]; then
            echo "::notice::pipeline: no open pull request at $sha; nothing to do"
            emit kind none; exit 0
          fi
          pr=$(jq -r .number <<< "$pull")
          branch=$(jq -r .head.ref <<< "$pull")
          author=$(jq -r .user.login <<< "$pull")

          # Only a known producer's revision may be promoted without a human.
          case "$branch" in
            automation/*|renovate/*)
              if jq -en --argjson allowed "$allowed" --arg a "$author" \
                   '$allowed | index($a) != null' >/dev/null; then
                kind=automation
              else
                echo "::warning::pipeline: $author opened $branch, which is not a known update producer; treating it as a human change"
                kind=human
              fi
              ;;
            *) kind=human ;;
          esac

          emit kind "$kind"; emit sha "$sha"; emit pr "$pr"; emit conclusion "$conclusion"

  validate:
    # Validation of a human revision from this definition, not relayed from ci.
    needs: resolve
    if: ${{ needs.resolve.outputs.kind == 'human' }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      revision: ${{ needs.resolve.outputs.sha }}
      generated_files: check

  candidate:
    needs: resolve
    if: ${{ needs.resolve.outputs.kind == 'automation' }}
    # The union of candidate.yml's grants: a call granting less fails at startup.
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/candidate.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_pr: ${{ needs.resolve.outputs.pr }}
      mode: automation
      # The candidate's stages run from this definition, so they certify this path.
      precheck: success
      # Per-repository build selection.
      targets: ${{ vars.CANDIDATE_TARGETS || '.#checks' }}
      systems: ${{ vars.CANDIDATE_SYSTEMS || 'x86_64-linux aarch64-linux' }}
      runner_system: ${{ vars.CANDIDATE_RUNNER_SYSTEM || 'aarch64-linux' }}
      builder_attr: ${{ vars.CANDIDATE_BUILDER_ATTR || 'ci' }}
    secrets: inherit

  human:
    needs: [resolve, validate]
    if: ${{ needs.resolve.outputs.kind == 'human' }}
    # Same union as `candidate`: a narrower caller grant fails the whole call.
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/candidate.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_pr: ${{ needs.resolve.outputs.pr }}
      mode: human
      precheck: ${{ needs.validate.result }}
    secrets: inherit

  refresh-open:
    # A candidate that no longer descends from main can never promote; under a
    # `label` policy acceptance re-validates instead.
    needs: resolve
    if: >-
      ${{ needs.resolve.outputs.kind == 'main-push'
        && vars.PROMOTION_POLICY != 'label'
        && needs.resolve.outputs.conclusion == 'success'
        && needs.resolve.outputs.include != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include || '[]') }}
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/candidate.yml
    with:
      source_sha: ${{ matrix.source_sha }}
      source_pr: ${{ matrix.source_pr }}
      mode: automation
      precheck: success
      targets: ${{ vars.CANDIDATE_TARGETS || '.#checks' }}
      systems: ${{ vars.CANDIDATE_SYSTEMS || 'x86_64-linux aarch64-linux' }}
      runner_system: ${{ vars.CANDIDATE_RUNNER_SYSTEM || 'aarch64-linux' }}
      builder_attr: ${{ vars.CANDIDATE_BUILDER_ATTR || 'ci' }}
    secrets: inherit
