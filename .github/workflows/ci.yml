# nix-fleet's own CI: formatting, all-systems evaluation, native check builds,
# plus the fleet build pipeline via the reusable
# workflow (this repo is its own first consumer — the ci builder set is the
# canonical inventory).
name: ci
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting (pinned tooling base)
        run: nix build --no-link .#checks.x86_64-linux.treefmt

      - name: Evaluate all systems
        run: nix flake check --no-build --no-write-lock-file --all-systems

      - name: Build all native checks (x86_64)
        # Includes the fixture and real-binary runtime checks. The preceding
        # all-systems evaluation covers ARM; builds here remain native.
        run: nix flake check --no-write-lock-file

  fleet-build:
    # Dogfood: nix-fleet schedules against its own canonical ci set. The
    # cache coordinates are the fixture's — first live run needs the real
    # secret (docs/contracts/ci.md caveats apply).
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-push-cache.yml
    with:
      # cache_api_url is deliberately absent: empty resolves the canonical
      # fleet.services."niks3-write" record, which is the point of the
      # contract. Pass it here only to point a run at a different cache.
      builder_attr: ci
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
