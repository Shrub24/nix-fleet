# Contributor-facing validation plus the fleet build (dispatch only). Holds no
# credential; see docs/contracts/ci.md.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # The event name keeps a push from cancelling a dispatched build.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: $/.github/workflows/validate.yml
    with:
      revision: ${{ github.sha }}
      generated_files: ${{ (startsWith(github.head_ref, 'automation/') || startsWith(github.head_ref, 'renovate/')) && 'skip' || 'check' }}

  fleet-build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/build-push-cache.yml
    with:
      profile: ci
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
