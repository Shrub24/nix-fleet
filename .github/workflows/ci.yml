# nix-fleet's own CI: formatting, flake checks, fixture toplevel builds on
# every declared system, plus the fleet build pipeline via the reusable
# workflow (this repo is its own first consumer — the ci builder set is the
# canonical inventory).
name: ci
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting (pinned tooling base)
        run: nix build --no-link .#checks.x86_64-linux.treefmt

      - name: Evaluate all systems
        run: nix flake check --no-build --no-write-lock-file --all-systems

      - name: Build fixture toplevel (x86_64)
        # --all-systems evaluates the aarch64 fixture; aarch64 toplevels are
        # built natively by aarch64 builders/consumers, not here.
        run: nix build --no-link .#checks.x86_64-linux.fixture-x86-64-linux

  fleet-build:
    # Dogfood: nix-fleet schedules against its own canonical ci set. The
    # cache coordinates are the fixture's — first live run needs the real
    # secret (docs/contracts/ci.md caveats apply).
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-push-cache.yml
    with:
      cache_api_url: ${{ vars.FLEET_NIKS3_API_URL }}
      builder_attr: ci
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
