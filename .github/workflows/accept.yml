# Records acceptance on the revision the label was applied to; a label survives a
# push, so the event payload's head is the evidence. See docs/contracts/update-candidates.md.
name: accept-update

on:
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_call:

permissions:
  statuses: write

jobs:
  mark:
    if: >-
      ${{ github.event.label.name == 'accept-update'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the accepted revision
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = labeled ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=update-accepted \
            -f "description=${ACTION} by ${ACTOR}" >/dev/null
          echo "update-accepted=$state on $SHA by $ACTOR"
