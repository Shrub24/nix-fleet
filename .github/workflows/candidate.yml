# Prepares, evaluates and builds one update candidate and posts its
# `update-candidate` status. Promotion is separate: promote-candidate.yml.
name: candidate

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Revision under validation: a pull request head, or a commit re-validated in place"
        type: string
        required: true
      source_pr:
        description: "Pull request number the revision belongs to"
        type: string
        required: true
      mode:
        description: "automation prepares, builds and validates a candidate; human only reports the required status"
        type: string
        required: false
        default: automation
      precheck:
        description: "Result of the trusted validation of this revision, run from a default-branch definition"
        type: string
        required: false
        default: success
      targets:
        description: "Flake selection to evaluate and build"
        type: string
        required: false
        default: ".#checks"
      systems:
        description: "Target systems (space-separated); independent of coordinator architecture"
        type: string
        required: false
        default: "x86_64-linux aarch64-linux"
      runner_system:
        description: "Nix system of the coordinator (aarch64-linux or x86_64-linux)"
        type: string
        required: false
        default: "aarch64-linux"
      builder_attr:
        description: "Builder profile package; empty builds locally only"
        type: string
        required: false
        default: "ci"

permissions:
  contents: read

# A newer revision supersedes an older candidate for the same pull request.
concurrency:
  group: candidate-${{ inputs.source_pr }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ inputs.mode == 'automation' && inputs.precheck == 'success' }}
    runs-on: ubuntu-latest
    # Read-only: this job runs the source revision's code.
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.commit.outputs.sha }}
      closure: ${{ steps.scope.outputs.closure }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      - name: Carry the current main
        # Merging keeps the source head reachable and makes the candidate landable.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git -c user.name="nix-fleet automation" \
                -c user.email="automation@users.noreply.github.com" \
                merge --no-edit origin/main
          fi

      - name: Regenerate the flake and lock
        # prepare-candidate.sh commits; a hosted runner carries no git identity.
        env:
          GIT_AUTHOR_NAME: nix-fleet automation
          GIT_AUTHOR_EMAIL: automation@users.noreply.github.com
          GIT_COMMITTER_NAME: nix-fleet automation
          GIT_COMMITTER_EMAIL: automation@users.noreply.github.com
        run: .github/scripts/prepare-candidate.sh

      - name: Confirm the candidate is a fixed point
        run: .github/scripts/prepare-candidate.sh --check

      - name: Record the candidate commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether the closure changes
        # A workflow-only change builds nothing; the status is still posted.
        id: scope
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/main HEAD)
          if [ -n "$changed" ] && ! grep -qv '^\.github/workflows/' <<< "$changed"; then
            echo "closure=false" >> "$GITHUB_OUTPUT"
          else
            echo "closure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the candidate for publication
        # The commit crosses to publishing as data; an empty range bundles the one commit.
        run: |
          set -euo pipefail
          range="origin/main..HEAD"
          if [ -z "$(git rev-list --max-count=1 "$range")" ]; then
            range="HEAD^!"
          fi
          git bundle create "$RUNNER_TEMP/candidate.bundle" $range

      - name: Upload the candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}/candidate.bundle
          if-no-files-found: error

  publish:
    # The only job with write access; the promoter verifies the bundle's ancestry.
    needs: prepare
    if: ${{ needs.prepare.outputs.candidate != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: candidate-bundle
          path: ${{ runner.temp }}

      - name: Publish the candidate ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_sha }}
          PR: ${{ inputs.source_pr }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$RUNNER_TEMP/candidate.bundle" HEAD
          fetched=$(git rev-parse FETCH_HEAD)
          if [ "$fetched" != "$CANDIDATE" ]; then
            echo "::error::the bundle carries $fetched, not the prepared candidate $CANDIDATE"
            exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$CANDIDATE:refs/candidates/$PR/$SOURCE-$CANDIDATE"

  evaluate:
    # Trusted validation from this file, after publication so the ref exists.
    needs: [prepare, publish]
    if: ${{ needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      revision: ${{ needs.prepare.outputs.candidate }}
      generated_files: skip

  build:
    needs: [prepare, publish]
    if: ${{ needs.publish.result == 'success' && needs.prepare.outputs.closure == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-push-cache.yml
    with:
      revision: ${{ needs.prepare.outputs.candidate }}
      targets: ${{ inputs.targets }}
      systems: ${{ inputs.systems }}
      runner_system: ${{ inputs.runner_system }}
      builder_attr: ${{ inputs.builder_attr }}
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}

  status:
    # Always runs: a failure must appear on the revision, not as a silent block.
    needs: [prepare, publish, evaluate, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The App key lives in an environment restricted to `main`.
    environment: automation
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Mint the automation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Post the status and report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.source_pr }}
          SOURCE: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode }}
          PRECHECK: ${{ inputs.precheck }}
          # Without a candidate the failure goes on the source revision; promotion
          # reads candidate statuses only.
          CANDIDATE: ${{ needs.prepare.outputs.candidate || inputs.source_sha }}
          PREPARE: ${{ needs.prepare.result }}
          PUBLISH: ${{ needs.publish.result }}
          EVALUATE: ${{ needs.evaluate.result }}
          BUILD: ${{ needs.build.result }}
          CLOSURE: ${{ needs.prepare.outputs.closure }}
        run: |
          set -euo pipefail
          if [ "$MODE" = human ]; then
            # A human change is certified by the trusted validation of its
            # revision, which the pipeline runs from its own definition rather
            # than relaying the result of the pull request's copy of `ci`.
            if [ "$PRECHECK" = success ]; then
              state=success
              detail="validated; merge by review"
            else
              state=failure
              detail="validation did not pass"
            fi
          elif [ "$PRECHECK" != success ]; then
            state=failure
            detail="repository validation did not pass"
          elif [ "$PREPARE" != success ]; then
            state=failure
            detail="candidate could not be prepared (regeneration or the merge with main failed)"
          elif [ "$PUBLISH" != success ]; then
            state=failure
            detail="the candidate ref could not be published"
          elif [ "$EVALUATE" != success ]; then
            state=failure
            detail="evaluation failed"
          elif [ "$CLOSURE" = false ]; then
            state=success
            detail="evaluated; workflow-only change, no closure build"
          elif [ "$BUILD" != success ]; then
            state=failure
            detail="build failed"
          else
            state=success
            detail="evaluated and built"
          fi

          gh api --method POST "repos/$REPO/statuses/$CANDIDATE" \
            -f state="$state" -f context=update-candidate \
            -f description="${detail:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null

          body=$(printf '%s\n' \
            "<!-- nix-fleet-candidate -->" \
            "### Update candidate" \
            "" \
            "- source: \`$SOURCE\`" \
            "- candidate: \`$CANDIDATE\`" \
            "- prepare: $PREPARE · publish: $PUBLISH · evaluate: $EVALUATE · build: $BUILD" \
            "- status \`update-candidate\`: **$state** — $detail")
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- nix-fleet-candidate -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
