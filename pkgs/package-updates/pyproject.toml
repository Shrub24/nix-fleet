[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "package-updates"
version = "1.0"
description = "Batch runner for the fleet package-update contract"
requires-python = ">=3.11"

[project.scripts]
update-packages = "package_updates.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["package_updates"]
