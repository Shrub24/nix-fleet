[project]
name = "notification-daemon"
version = "1.0"
description = "Generic HTTP notification dispatch daemon"
requires-python = ">=3.10"
dependencies = ["apprise", "fastapi", "uvicorn"]

[project.scripts]
notification-daemon = "notification_api.__main__:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
